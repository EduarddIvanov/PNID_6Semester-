name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    
    # Завдання 3: Мультиверсійне тестування
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Завдання 2: Перевірка стилю коду (Linting)
    - name: Lint with flake8
      run: |
        # Зупиняє білд, якщо є синтаксичні помилки
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Перевіряє стиль, але не зупиняє білд (exit-zero)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Завдання 1 та 5: Автоматичне тестування з Pytest та HTML-звіт
    - name: Test with pytest and generate HTML report
      run: |
        pytest --html=report-${{ matrix.python-version }}.html --self-contained-html

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report-python-${{ matrix.python-version }}
        path: report-${{ matrix.python-version }}.html
        retention-days: 5

  build_docker:
    # Запуск Docker збірки тільки після успішного проходження тестів
    needs: lint_and_test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Завдання 4: Збірка Docker-контейнера
    - name: Build Docker image
      run: |
        docker build -t my-python-app:${{ github.sha }} .
